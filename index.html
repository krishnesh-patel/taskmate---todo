<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskMate - To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>TaskMate</h1>
    <p class="subtitle">Simple To-Do List Web App</p>

    <form id="taskForm">
      <input id="taskInput" type="text" placeholder="Enter a task..." autocomplete="off" required>
      <button type="submit">Add Task</button>
    </form>

    <div class="toolbar">
      <span id="taskCount">0 tasks</span>
      <button id="clearCompleted" type="button">Clear Completed</button>
    </div>

    <ul id="taskList"></ul>
    <p id="emptyMessage" class="empty">No tasks yet. Add your first task!</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
